services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ilchiosco
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ilchiosco
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      POS_DRIVER: ${POS_DRIVER:-simulation}
    ports:
      - "3000:3000"

volumes:
  db-data:
